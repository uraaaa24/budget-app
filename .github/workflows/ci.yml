name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality-check:
    runs-on: ubuntu-latest
    name: Quality Check

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (web + backend)
        run: pnpm run check-types

      - name: Lint (web + backend)
        run: pnpm run lint

      - name: Build (web + backend)
        run: pnpm run build
